<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pengaturan | Monitoring IoT</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#0f172a;
  color:white;
}

.app-shell{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:250px;
  background:#111827;
  padding:20px;
}

.sidebar-brand{
  font-size:22px;
  font-weight:bold;
  margin-bottom:30px;
}

.sidebar-brand span{
  color:#7c3aed;
}

.sidebar-nav{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.sidebar-nav a,
.logout{
  text-decoration:none;
  color:#cbd5e1;
  padding:12px;
  border-radius:12px;
  transition:.3s;
  border:none;
  background:none;
  cursor:pointer;
  text-align:left;
}

.sidebar-nav a:hover,
.sidebar-nav .active,
.logout:hover{
  background:#7c3aed;
  color:white;
}

/* MAIN */

.main{
  flex:1;
  padding:30px;
}

.page-header{
  margin-bottom:25px;
}

.page-header p{
  color:#94a3b8;
  margin-top:5px;
}

/* GRID */

.settings-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
  gap:20px;
}

/* CARD */

.card{
  background:#1e293b;
  border-radius:24px;
  padding:24px;
  border:1px solid rgba(255,255,255,.05);
}

.card h3{
  margin-bottom:20px;
}

/* FORM */

.form-group{
  margin-bottom:18px;
}

.form-group label{
  display:block;
  margin-bottom:8px;
  color:#cbd5e1;
}

.form-group input,
.form-group select{
  width:100%;
  padding:14px;
  border:none;
  outline:none;
  border-radius:12px;
  background:#111827;
  color:white;
}

.form-group input::placeholder{
  color:#64748b;
}

/* SWITCH */

.setting-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.setting-row:last-child{
  border-bottom:none;
}

.switch{
  width:50px;
  height:26px;
  appearance:none;
  background:#334155;
  border-radius:999px;
  position:relative;
  cursor:pointer;
}

.switch:checked{
  background:#7c3aed;
}

.switch::before{
  content:'';
  position:absolute;
  width:20px;
  height:20px;
  background:white;
  border-radius:50%;
  top:3px;
  left:3px;
  transition:.3s;
}

.switch:checked::before{
  left:27px;
}

/* BUTTON */

.save-btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  background:#7c3aed;
  color:white;
  font-weight:bold;
  cursor:pointer;
  margin-top:20px;
}

.save-btn:hover{
  background:#6d28d9;
}

.success-box{
  display:none;
  margin-top:15px;
  background:rgba(34,197,94,.15);
  color:#22c55e;
  padding:14px;
  border-radius:12px;
}

/* MOBILE */

@media(max-width:900px){

  .sidebar{
    display:none;
  }

  .main{
    padding:20px;
  }

}

</style>
</head>

<body>

<div class="app-shell">

  <aside class="sidebar">

    <div class="sidebar-brand">
      Monitoring<span>IoT</span>
    </div>

    <nav class="sidebar-nav">

      <a href="dashboard.html">📊 Dashboard</a>
      <a href="sensor.html">🌡 Sensor</a>
      <a href="riwayat.html">📈 Riwayat</a>
      <a href="pengaturan.html" class="active">⚙ Pengaturan</a>

      <button id="logoutBtn" class="logout">
        ↩ Keluar
      </button>

    </nav>

  </aside>

  <main class="main">

    <div class="page-header">

      <h1>⚙ Pengaturan Sistem</h1>

      <p>
        Kelola akun dan konfigurasi monitoring IoT.
      </p>

    </div>

    <div class="settings-grid">

      <!-- PROFIL -->

      <div class="card">

        <h3>👤 Profil Pengguna</h3>

        <div class="form-group">
          <label>Nama</label>
          <input
            type="text"
            placeholder="Masukkan nama"
          >
        </div>

        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            placeholder="Masukkan email"
          >
        </div>

      </div>

      <!-- SENSOR -->

      <div class="card">

        <h3>🌡 Pengaturan Sensor</h3>

        <div class="form-group">
          <label>Suhu Minimum</label>
          <input type="number" value="20">
        </div>

        <div class="form-group">
          <label>Suhu Maksimum</label>
          <input type="number" value="35">
        </div>

      </div>

      <!-- SISTEM -->

      <div class="card">

        <h3>⚡ Sistem</h3>

        <div class="form-group">

          <label>Refresh Data</label>

          <select>
            <option>5 Detik</option>
            <option>10 Detik</option>
            <option>30 Detik</option>
            <option>60 Detik</option>
          </select>

        </div>

        <div class="setting-row">
          <span>Auto Refresh</span>
          <input type="checkbox" class="switch" checked>
        </div>

      </div>

      <!-- NOTIFIKASI -->

      <div class="card">

        <h3>🔔 Notifikasi</h3>

        <div class="setting-row">
          <span>Notifikasi Sensor</span>
          <input type="checkbox" class="switch" checked>
        </div>

        <div class="setting-row">
          <span>Email Alert</span>
          <input type="checkbox" class="switch">
        </div>

        <div class="setting-row">
          <span>Alarm Suhu Tinggi</span>
          <input type="checkbox" class="switch" checked>
        </div>

      </div>

    </div>

    <button id="saveBtn" class="save-btn">
      💾 Simpan Pengaturan
    </button>

    <div id="successBox" class="success-box">
      Pengaturan berhasil disimpan.
    </div>

  </main>

</div>

<script>

document
.getElementById("logoutBtn")
.addEventListener("click",()=>{

  window.location.href =
  "login.html";

});

document
.getElementById("saveBtn")
.addEventListener("click",()=>{

  const box =
  document.getElementById("successBox");

  box.style.display = "block";

  setTimeout(()=>{

    box.style.display = "none";

  },3000);

});

</script>

</body>
</html>
