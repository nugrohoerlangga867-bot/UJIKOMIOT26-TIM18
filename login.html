<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Login | Monitoring IoT</title>

  <!-- ICON -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      overflow:hidden;
    }

    .login-body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .login-wrapper{
      width:100%;
      max-width:1100px;
      background:#111827;
      border-radius:30px;
      overflow:hidden;
      display:grid;
      grid-template-columns:1fr 1fr;
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
    }

    /* LEFT */
    .login-card{
      padding:50px;
    }

    .login-brand{
      margin-bottom:40px;
    }

    .login-brand img{
      width:70px;
      margin-bottom:20px;
    }

    .login-brand h1{
      font-size:32px;
      margin-bottom:10px;
    }

    .login-brand p{
      color:#94a3b8;
      line-height:1.6;
    }

    /* FORM */
    .login-form{
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    .form-group{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .form-group label{
      font-size:14px;
      color:#cbd5e1;
    }

    .form-group input{
      padding:15px;
      border:none;
      border-radius:14px;
      background:#1e293b;
      color:#f8fafc;
      outline:none;
      font-size:15px;
    }

    .form-group input::placeholder{
      color:#94a3b8;
    }

    /* FIX AUTOFILL */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus{
      -webkit-text-fill-color:#f8fafc;
      transition:background-color 5000s ease-in-out 0s;
      box-shadow:0 0 0px 1000px #1e293b inset;
    }

    /* PASSWORD */
    .password-wrapper{
      position:relative;
    }

    .password-wrapper input{
      width:100%;
      padding-right:50px;
    }

    .toggle-password{
      position:absolute;
      right:18px;
      top:50%;
      transform:translateY(-50%);
      cursor:pointer;
      color:#94a3b8;
      transition:0.3s;
    }

    .toggle-password:hover{
      color:white;
    }

    /* ROW */
    .form-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:14px;
      color:#cbd5e1;
    }

    .link{
      color:#a78bfa;
      text-decoration:none;
    }

    .link:hover{
      text-decoration:underline;
    }

    /* BUTTON */
    .btn{
      padding:15px;
      border:none;
      border-radius:14px;
      background:#7c3aed;
      color:white;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      background:#6d28d9;
      transform:translateY(-2px);
    }

    .form-message{
      text-align:center;
      font-size:14px;
    }

    /* RIGHT */
    .login-art{
      background:linear-gradient(135deg,#7c3aed,#4f46e5);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:50px;
    }

    .art-content{
      max-width:400px;
    }

    .art-content h2{
      font-size:50px;
      line-height:1.2;
      margin-bottom:20px;
    }

    .art-content p{
      line-height:1.8;
      color:#e9d5ff;
    }

    /* RESPONSIVE */
    @media(max-width:900px){

      body{
        overflow:auto;
      }

      .login-wrapper{
        grid-template-columns:1fr;
      }

      .login-art{
        display:none;
      }

    }

  </style>
</head>

<body class="login-body">

<div class="login-wrapper">

  <!-- LOGIN -->
  <div class="login-card">

    <div class="login-brand">

      <img src="img/logo.png" alt="Logo">

      <h1>Selamat Datang Kembali</h1>

      <p>
        Masuk untuk mengakses dashboard monitoring IoT Anda
      </p>

    </div>

    <form id="loginForm" class="login-form">

      <!-- EMAIL -->
      <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          id="email"
          placeholder="nama@email.com"
          required
        >

      </div>

      <!-- PASSWORD -->
      <div class="form-group">

        <label>Password</label>

        <div class="password-wrapper">

          <input
            type="password"
            id="password"
            placeholder="••••••••"
            required
          >

          <!-- ICON MATA -->
          <i
            class="fa-solid fa-eye toggle-password"
            id="togglePassword"
          ></i>

        </div>

      </div>

      <!-- OPTIONS -->
      <div class="form-row">

        <label>
          <input type="checkbox">
          Ingat saya
        </label>

        <a href="#" class="link">
          Lupa password?
        </a>

      </div>

      <!-- BUTTON -->
      <button type="submit" class="btn">
        Masuk
      </button>

      <p id="loginMessage" class="form-message"></p>

    </form>

  </div>

  <!-- RIGHT SIDE -->
  <div class="login-art">

    <div class="art-content">

      <h2>
        Monitoring <br>
        Lebih Cerdas
      </h2>

      <p>
        Pantau seluruh sensor IoT Anda dalam
        satu dashboard modern dan realtime.
      </p>

    </div>

  </div>

</div>

<!-- SCRIPT -->
<script>

  // SHOW PASSWORD
  const togglePassword =
    document.getElementById("togglePassword");

  const password =
    document.getElementById("password");

  togglePassword.addEventListener("click", () => {

    const type =
      password.type === "password"
      ? "text"
      : "password";

    password.type = type;

    togglePassword.classList.toggle("fa-eye");

    togglePassword.classList.toggle("fa-eye-slash");

  });

  // LOGIN
  const loginForm =
    document.getElementById("loginForm");

  const loginMessage =
    document.getElementById("loginMessage");

  loginForm.addEventListener("submit", (e) => {

    e.preventDefault();

    loginMessage.style.color = "#22c55e";

    loginMessage.innerText =
      "Login berhasil...";

    // REDIRECT
    setTimeout(() => {

      window.location.href =
        "dashboard.html";

    }, 1000);

  });

</script>

</body>
</html>
