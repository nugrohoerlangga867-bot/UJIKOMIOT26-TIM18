<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Monitoring IoT</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

.login-card{
  width:420px;
  background:#1e293b;
  padding:35px;
  border-radius:24px;
  box-shadow:0 15px 40px rgba(0,0,0,.3);
}

.login-header{
  text-align:center;
  margin-bottom:30px;
}

.login-header h1{
  margin-bottom:10px;
}

.login-header p{
  color:#94a3b8;
}

.form-group{
  margin-bottom:20px;
}

.form-group label{
  display:block;
  margin-bottom:8px;
  color:#cbd5e1;
}

.form-group input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#111827;

  /* FIX TEXT */
  color:white;

  outline:none;
}

.form-group input::placeholder{
  color:#64748b;
}

/* PASSWORD */

.password-wrapper{
  position:relative;
}

.password-wrapper input{
  padding-right:50px;
}

.toggle-password{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  user-select:none;
  font-size:18px;
}

/* REMEMBER */

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.row a{
  color:#a78bfa;
  text-decoration:none;
}

/* BUTTON */

.login-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#7c3aed;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
}

.login-btn:hover{
  background:#6d28d9;
}

.message{
  text-align:center;
  margin-top:15px;
  color:#f87171;
}

</style>
</head>

<body>

<div class="login-card">

  <div class="login-header">
    <h1>Monitoring IoT</h1>
    <p>Masuk untuk melanjutkan</p>
  </div>

  <form id="loginForm">

    <div class="form-group">

      <label>Email</label>

      <input
        type="email"
        id="email"
        placeholder="nama@email.com"
        required
      >

    </div>

    <div class="form-group">

      <label>Password</label>

      <div class="password-wrapper">

        <input
          type="password"
          id="password"
          placeholder="Masukkan password"
          required
        >

        <span
          class="toggle-password"
          id="togglePassword"
        >
          👁️
        </span>

      </div>

    </div>

    <div class="row">

      <label>
        <input type="checkbox">
        Ingat saya
      </label>

      <a href="#">
        Lupa Password?
      </a>

    </div>

    <button
      type="submit"
      class="login-btn"
    >
      Masuk
    </button>

    <p id="loginMessage" class="message"></p>

  </form>

</div>

<script>

// SHOW PASSWORD

const togglePassword =
document.getElementById("togglePassword");

const password =
document.getElementById("password");

togglePassword.addEventListener("click",()=>{

  if(password.type==="password"){

    password.type="text";
    togglePassword.textContent="🙈";

  }else{

    password.type="password";
    togglePassword.textContent="👁️";

  }

});

</script>

<script type="module" src="js/auth.js"></script>

</body>
</html>
